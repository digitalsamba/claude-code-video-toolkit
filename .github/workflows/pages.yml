name: Pages

# Publishes site/ to GitHub Pages. Needs Settings > Pages > Source: "GitHub Actions" (once).
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'assets/readme-thumbs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        # the video thumbnails live once, in assets/readme-thumbs, and are shared with the README
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r assets/readme-thumbs _site/img
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
