# claude-code-video-toolkit — Python dependencies
#
# Managed with uv (https://docs.astral.sh/uv/). One command installs everything:
#
#   uv sync                      # core deps: voiceover, image gen, music, moviepy examples
#   uv sync --extra whisper      # + openai-whisper for burned karaoke captions (heavy, pulls in torch)
#   uv sync --extra modal        # + Modal CLI for self-hosted cloud GPU fallback
#   uv sync --all-extras         # everything
#
# Then run any tool through the project environment:
#
#   uv run tools/voiceover.py --help
#
# No build system is declared on purpose: this is a toolkit of standalone CLI
# scripts, not an installable package. `uv sync` only manages the environment.

[project]
name = "claude-code-video-toolkit"
version = "0.17.0"
description = "AI-native video production workspace: Remotion templates, AI voiceover/music/image tools, and browser demo recording"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "elevenlabs>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    # Cloudflare R2 file transfer (S3-compatible)
    "boto3>=1.28.0",
    # Image processing — tools/flux2.py, tools/image_edit.py, and the moviepy
    # examples for PIL-based text rendering
    "pillow>=10.0",
    # moviepy examples (examples/quick-spot, examples/data-viz-chart) —
    # Python-native video composition as an alternative to Remotion
    "moviepy>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Burned karaoke captions in templates/concept-explainer-short
# (word-level timing; heavy install, pulls in torch)
whisper = [
    "openai-whisper>=20231117",
]
# Self-hosted cloud GPU fallback via Modal (see docs/modal-setup.md)
modal = [
    "modal>=0.64",
]
